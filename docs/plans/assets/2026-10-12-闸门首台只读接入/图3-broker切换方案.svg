<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1472.493 348.5" width="1472.493" height="348.5" style="--bg:#FFFFFF;--fg:#27272A;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<g class="subgraph" data-id="NOW" data-label="现状">
  <rect x="40" y="113.125" width="221.40899999999996" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="40" y="113.125" width="221.40899999999996" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="52" y="127.125" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">现状</text>
</g>
<g class="subgraph" data-id="A" data-label="方案 A（建议首选）
厂家把 DTU 指到我方 broker">
  <rect x="493.145" y="40" width="655.033" height="113.80000000000001" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="493.145" y="40" width="655.033" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="505.145" y="54" font-size="12" font-weight="600" fill="var(--_text-sec)"><tspan x="505.145" dy="-3.6000000000000014">方案 A（建议首选）</tspan><tspan x="505.145" dy="15.600000000000001">厂家把 DTU 指到我方 broker</tspan></text>
</g>
<g class="subgraph" data-id="B" data-label="方案 B（备选）
厂家平台转发给我们">
  <rect x="436.0880000000001" y="177.8" width="712.0899999999999" height="130.7" rx="0" ry="0" fill="var(--_group-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="436.0880000000001" y="177.8" width="712.0899999999999" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="448.0880000000001" y="191.8" font-size="12" font-weight="600" fill="var(--_text-sec)"><tspan x="448.0880000000001" dy="-3.6000000000000014">方案 B（备选）</tspan><tspan x="448.0880000000001" dy="15.600000000000001">厂家平台转发给我们</tspan></text>
</g>
<polyline class="edge" data-from="D0" data-to="A1" data-style="dotted" data-arrow-start="false" data-arrow-end="true" data-label="单中心限制：
DTU 只能指向一个平台，
切换后厂家平台即断连" points="245.40899999999996,175.05833333333334 295.409,175.05833333333334 295.409,110.9 509.145,110.9" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="D0" data-to="B1" data-style="dotted" data-arrow-start="false" data-arrow-end="true" points="245.40899999999996,192.99166666666667 418.0880000000001,192.99166666666667 418.0880000000001,257.15 452.0880000000001,257.15" fill="none" stroke="var(--_line)" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="A3" data-to="ROLL" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1133.66,110.9 1163.9189999999999,110.9 1163.9189999999999,184.025 1194.1779999999999,184.025" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B3" data-to="ROLL" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1130.696,257.15 1163.9189999999999,257.15 1163.9189999999999,184.025 1194.1779999999999,184.025" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="A1" data-to="A2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="684.4749999999999,110.9 724.4749999999999,110.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="A2" data-to="A3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="884.2439999999999,110.9 925.726,110.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B1" data-to="B2" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="642.238,257.15 682.238,257.15" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="B2" data-to="B3" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="887.2080000000001,257.15 925.726,257.15" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="edge-label" data-from="D0" data-to="A1" data-label="单中心限制：
DTU 只能指向一个平台，
切换后厂家平台即断连">
  <rect x="303.409" y="80.9" width="147.736" height="58.900000000000006" rx="2" ry="2" fill="var(--bg)" stroke="var(--_inner-stroke)" stroke-width="1" />
  <text x="377.277" y="110.35000000000001" text-anchor="middle" font-size="11" font-weight="400" fill="var(--_text-sec)"><tspan x="377.277" dy="-10.450000000000001">单中心限制：</tspan><tspan x="377.277" dy="14.3">DTU 只能指向一个平台，</tspan><tspan x="377.277" dy="14.3">切换后厂家平台即断连</tspan></text>
</g>
<g class="node" data-id="ROLL" data-label="回退方案：
DTU 指回厂家 broker 参数
切换窗口与现场/厂家事先约定" data-shape="rectangle">
  <rect x="1194.1779999999999" y="148.675" width="238.31499999999997" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1313.3355" y="184.025" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1313.3355" dy="-12.350000000000001">回退方案：</tspan><tspan x="1313.3355" dy="16.900000000000002">DTU 指回厂家 broker 参数</tspan><tspan x="1313.3355" dy="16.900000000000002">切换窗口与现场/厂家事先约定</tspan></text>
</g>
<g class="node" data-id="D0" data-label="DTU 当前指向厂家平台
数据只上厂家平台" data-shape="rectangle">
  <rect x="56" y="157.125" width="189.40899999999996" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="150.7045" y="184.025" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="150.7045" dy="-3.9000000000000012">DTU 当前指向厂家平台</tspan><tspan x="150.7045" dy="16.900000000000002">数据只上厂家平台</tspan></text>
</g>
<g class="node" data-id="A1" data-label="厂家远程或现场修改
DTU 的平台接入信息" data-shape="rectangle">
  <rect x="509.145" y="84" width="175.32999999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="596.81" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="596.81" dy="-3.9000000000000012">厂家远程或现场修改</tspan><tspan x="596.81" dy="16.900000000000002">DTU 的平台接入信息</tspan></text>
</g>
<g class="node" data-id="A2" data-label="DTU 断连厂家平台
改连我方 broker" data-shape="rectangle">
  <rect x="724.4749999999999" y="84" width="159.769" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="804.3594999999999" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="804.3594999999999" dy="-3.9000000000000012">DTU 断连厂家平台</tspan><tspan x="804.3594999999999" dy="16.900000000000002">改连我方 broker</tspan></text>
</g>
<g class="node" data-id="A3" data-label="我方 worker 收到上行报文" data-shape="rectangle">
  <rect x="925.726" y="92.45" width="207.934" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1029.693" y="110.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">我方 worker 收到上行报文</text>
</g>
<g class="node" data-id="B1" data-label="厂家平台保留设备连接" data-shape="rectangle">
  <rect x="452.0880000000001" y="238.70000000000002" width="190.14999999999998" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="547.163" y="257.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">厂家平台保留设备连接</text>
</g>
<g class="node" data-id="B2" data-label="厂家平台经 API 或 MQTT
