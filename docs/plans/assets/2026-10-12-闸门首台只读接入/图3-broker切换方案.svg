  <rect x="682.238" y="221.8" width="204.96999999999997" height="70.7" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="784.7230000000001" y="257.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="784.7230000000001" dy="-12.350000000000001">厂家平台经 API 或 MQTT</tspan><tspan x="784.7230000000001" dy="16.900000000000002">把上行数据推送给我方</tspan><tspan x="784.7230000000001" dy="16.900000000000002">需厂家开发支持，待确认</tspan></text>
</g>
<g class="node" data-id="B3" data-label="我方新增接收适配
报文格式以厂家转发为准" data-shape="rectangle">
  <rect x="925.726" y="230.25" width="204.96999999999997" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1028.211" y="257.15" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1028.211" dy="-3.9000000000000012">我方新增接收适配</tspan><tspan x="1028.211" dy="16.900000000000002">报文格式以厂家转发为准</tspan></text>
</g>
</svg>